services:
  - type: web
    name: refinify-backend
    env: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: UPLOAD_FOLDER
        value: uploads
      - key: SQLALCHEMY_DATABASE_URI
        value: sqlite:///app.db
      - key: MAX_CONTENT_LENGTH
        value: "16777216"
      - key: CORS_ORIGINS
        value: "https://refinify-frontend.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: FLASK_ENV
        value: production
    healthCheckPath: /health
    buildCommand: echo "Using Dockerfile"
    startCommand: gunicorn -w 2 -k gthread -b 0.0.0.0:$PORT --timeout 120 app:app

